<!doctype html>
<html lang="ar" dir="rtl">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>فعالية الأرواح</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  font-family:Arial,sans-serif;

  background:
    radial-gradient(
      circle at top,
      #252c38 0,
      #101318 55%,
      #090c10 100%
    );

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:25px;
}

.card{
  width:min(620px,100%);

  background:#1b2028;

  border:1px solid #303743;

  border-radius:22px;

  padding:35px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.35);

  text-align:center;
}

.logo{
  font-size:58px;
  margin-bottom:10px;
}

h1{
  margin:0 0 12px;
  font-size:32px;
}

.description{
  color:#aab3bf;
  line-height:1.8;
  margin-bottom:28px;
}

button{
  width:100%;

  border:0;

  border-radius:13px;

  padding:15px 20px;

  font:inherit;

  font-weight:bold;

  cursor:pointer;

  color:#fff;

  background:#16834a;

  transition:.15s;
}

button:hover{
  filter:brightness(1.12);
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.result{
  display:none;

  margin-top:25px;

  text-align:right;
}

.result.show{
  display:block;
}

.success{
  padding:14px;

  border-radius:12px;

  background:#123d29;

  border:1px solid #1d6846;

  color:#b8f3d2;

  margin-bottom:18px;

  text-align:center;
}

.box{
  background:#11161c;

  border:1px solid #303743;

  border-radius:13px;

  padding:14px;

  margin-top:12px;
}

.box label{
  display:block;

  color:#aab3bf;

  font-size:13px;

  margin-bottom:8px;
}

.linkRow{
  display:flex;

  gap:8px;
}

.linkRow input{
  flex:1;

  min-width:0;

  background:#0b0f14;

  color:#fff;

  border:1px solid #3a424e;

  border-radius:9px;

  padding:10px;

  direction:ltr;
}

.copy{
  width:auto;

  padding:10px 14px;

  background:#245a9c;

  white-space:nowrap;
}

.control{
  margin-top:18px;

  background:#245a9c;
}

.error{
  display:none;

  margin-top:15px;

  padding:12px;

  border-radius:10px;

  background:#4a1e24;

  border:1px solid #7b222b;

  color:#ffccd1;
}

.error.show{
  display:block;
}

.note{
  margin-top:22px;

  color:#697482;

  font-size:13px;

  line-height:1.7;
}

</style>

</head>

<body>

<div class="card">

  <div class="logo">🎮</div>

  <h1>فعالية الأرواح</h1>

  <div class="description">
    أنشئ غرفتك الخاصة وابدأ مسابقتك.
    <br>
    لكل غرفة لوحة تحكم ورابط OBS مستقل.
  </div>


  <button
    id="createButton"
    onclick="createRoom()"
  >
    🏠 إنشاء غرفة جديدة
  </button>


  <div
    id="error"
    class="error"
  ></div>


  <div
    id="result"
    class="result"
  >

    <div class="success">
      ✅ تم إنشاء غرفتك بنجاح
    </div>


    <div class="box">

      <label>
        🔧 رابط لوحة التحكم
      </label>

      <div class="linkRow">

        <input
          id="controlUrl"
          readonly
        >

        <button
          class="copy"
          onclick="copyValue('controlUrl')"
        >
          📋 نسخ
        </button>

      </div>

    </div>


    <div class="box">

      <label>
        🖥️ رابط شاشة OBS
      </label>

      <div class="linkRow">

        <input
          id="obsUrl"
          readonly
        >

        <button
          class="copy"
          onclick="copyValue('obsUrl')"
        >
          📋 نسخ
        </button>

      </div>

    </div>


    <button
      id="openControl"
      class="control"
      onclick="openControl()"
    >
      🔧 فتح لوحة التحكم
    </button>


    <div class="note">

      احتفظ برابط لوحة التحكم الخاص بك.
      <br>
      كل غرفة مستقلة عن الغرف الأخرى.

    </div>

  </div>

</div>


<script>

/* =========================================================
   متغيرات
========================================================= */

let roomData = null;


/* =========================================================
   إنشاء غرفة
========================================================= */

async function createRoom(){

  const button =
    document.getElementById(
      "createButton"
    );

  const error =
    document.getElementById(
      "error"
    );

  const result =
    document.getElementById(
      "result"
    );


  error.classList.remove(
    "show"
  );

  result.classList.remove(
    "show"
  );


  button.disabled = true;

  button.textContent =
    "⏳ جاري إنشاء الغرفة...";


  try{

    const response =
      await fetch(
        "/api/rooms",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          }
        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        "تعذر إنشاء الغرفة."
      );

    }


    roomData =
      data.room;


    document.getElementById(
      "controlUrl"
    ).value =
      roomData.controlUrl;


    document.getElementById(
      "obsUrl"
    ).value =
      roomData.obsUrl;


    result.classList.add(
      "show"
    );


    button.textContent =
      "✅ تم إنشاء الغرفة";


  }catch(err){

    console.error(
      err
    );


    error.textContent =
      "❌ " +
      (
        err.message ||
        "حدث خطأ أثناء إنشاء الغرفة."
      );


    error.classList.add(
      "show"
    );


    button.disabled =
      false;


    button.textContent =
      "🏠 إنشاء غرفة جديدة";

  }

}


/* =========================================================
   فتح لوحة التحكم
========================================================= */

function openControl(){

  if(
    !roomData?.controlUrl
  ){
    return;
  }


  window.location.href =
    roomData.controlUrl;

}


/* =========================================================
   نسخ الرابط
========================================================= */

async function copyValue(
  elementId
){

  const input =
    document.getElementById(
      elementId
    );


  const value =
    input.value;


  if(!value){
    return;
  }


  try{

    await navigator.clipboard
      .writeText(
        value
      );


    const buttons =
      document.querySelectorAll(
        ".copy"
      );


    /*
      تغيير نص زر النسخ
      لثانية واحدة.
    */

    buttons.forEach(
      button => {

        if(
          button.previousElementSibling ===
          input
        ){

          const oldText =
            button.textContent;


          button.textContent =
            "✅ تم النسخ";


          setTimeout(
            () => {

              button.textContent =
                oldText;

            },
            1200
          );

        }

      }
    );


  }catch(err){

    /*
      حل بديل إذا منع المتصفح
      Clipboard API.
    */

    input.select();

    input.setSelectionRange(
      0,
      input.value.length
    );


    alert(
      "انسخ الرابط المحدد الآن."
    );

  }

}

</script>

</body>

</html>
